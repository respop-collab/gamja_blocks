# 안드로이드 APK/AAB 와 iOS 앱을 자동 빌드한다.
# PC에 Android Studio 나 Xcode 없이 GitHub Actions 에서만 빌드한다.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    # 실패 로그를 이슈로 남기기 위한 권한
    permissions:
      contents: read
      issues: write
    # secrets 컨텍스트는 스텝의 if 에서 쓸 수 없다. 잡 수준 env 로 옮겨야 동작한다.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: |
          flutter create --platforms=android --org com.seiho --project-name gamja_blocks .
          rm -f test/widget_test.dart   # flutter create 가 만드는 기본 테스트 제거

      - name: Fetch Korean fonts
        run: python3 tools/fetch_fonts.py

      - name: Inject platform config
        run: python3 tools/patch_platform.py

      - name: App launcher icon
        run: |
          python3 -m pip install --quiet --upgrade Pillow || true
          python3 tools/make_icons.py

      - name: Dependencies
        run: |
          set +e
          flutter pub get > pub.txt 2>&1
          code=$?
          echo "## 의존성 설치 (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 pub.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # 진단 목적: 결과를 실행 요약 페이지에 남긴다.
      # 로그를 열어 보지 않아도 요약만 보면 무엇이 틀렸는지 알 수 있다.
      - name: Analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          echo "## 분석 결과 (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 analyze.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Test
        continue-on-error: true
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          echo "## 테스트 결과 (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 test.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug > build.txt 2>&1
          code=$?
          echo "## 빌드 결과 (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -150 build.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Prepare release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOT
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOT
          python3 tools/enable_signing.py

      # 서명 키가 없으면 AAB 를 만들지 않는다.
      # 서명 없는 AAB 는 플레이 콘솔이 받아 주지 않으므로 만들어 봐야 혼란만 준다.
      - name: Build release AAB
        if: env.HAS_KEYSTORE == 'true'
        run: flutter build appbundle --release

      # 실패하면 로그를 이슈로 남긴다.
      # 깃허브 실행 로그는 로그인 없이 읽을 수 없어서, 읽을 수 있는 곳에 옮겨 둔다.
      - name: Report logs as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "빌드 #${{ github.run_number }} 실패 기록입니다. 확인 후 닫으십시오."
            echo
            for f in pub analyze test build; do
              if [ -f "$f.txt" ]; then
                echo "## $f"
                echo '```'
                tail -120 "$f.txt"
                echo '```'
                echo
              fi
            done
          } > report.md
          gh issue create \
            --title "CI 실패 기록 #${{ github.run_number }}" \
            --body-file report.md

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gamja-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: gamja-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # iOS 는 서명 없이 빌드만 한다.
  # 구글 먼저 올리기로 했으므로 push 마다 돌리지 않는다.
  # macOS 러너는 분당 비용이 10배라 무료 한도를 빠르게 먹는다.
  # 애플 준비를 시작할 때 Actions 탭에서 수동 실행한다.
  # 목적은 두 가지다. 첫째, 아이폰에서도 컴파일되는지 확인한다.
  # 둘째, Info.plist 와 개인정보 매니페스트 주입이 실제로 먹는지 확인한다.
  # 앱 스토어 업로드는 애플 개발자 계정과 서명이 필요하므로 Xcode 에서 따로 한다.
  ios:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: |
          flutter create --platforms=ios --org com.seiho --project-name gamja_blocks .
          rm -f test/widget_test.dart

      - name: Fetch Korean fonts
        run: python3 tools/fetch_fonts.py

      - name: Inject platform config
        run: python3 tools/patch_platform.py

      - name: App icon
        run: |
          python3 -m pip install --quiet --upgrade Pillow --break-system-packages || \
          python3 -m pip install --quiet --upgrade Pillow || true
          python3 tools/make_icons.py

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Check injected settings
        run: |
          echo "--- Info.plist ---"
          grep -c GADApplicationIdentifier ios/Runner/Info.plist
          grep -c ITSAppUsesNonExemptEncryption ios/Runner/Info.plist
          echo "--- privacy manifest ---"
          test -f ios/Runner/PrivacyInfo.xcprivacy && echo present

      - uses: actions/upload-artifact@v4
        with:
          name: gamja-ios-app
          path: build/ios/iphoneos/Runner.app
